<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi sitio web</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>


    <main>

    <div class="Tituloreg">
        <h4>REGISTRATE</h4>
    </div>

    <form action="login.html" method="post" class="formularioRegistro">

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div>
            <label for="repetirPassword">Repetir contraseña:</label>
            <input type="password" id="repetirPassword" name="repetirPassword" required>
        </div>

        <div>
            <label>
                <input type="checkbox" name="terminos" required>
                Acepto términos y condiciones
            </label>
        </div>

        <div>
            <button type="submit">Registrarme</button>
        </div>

        <div>
            <a href="login.html">Ya tengo una cuenta</a>
        </div>

    </form>

</main>
    
</body>
</html>
